<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 응원 한마디</title>
  <style>
    :root {
      --bg: #fff8ef;
      --card: #ffffff;
      --text: #2b2520;
      --muted: #75695e;
      --accent: #e8590c;
      --accent-text: #ffffff;
      --border: #e6d9c8;
      --error: #c92a2a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1a17;
        --card: #2a2622;
        --text: #f5ede3;
        --muted: #b5a898;
        --accent: #ff922b;
        --accent-text: #1d1a17;
        --border: #453e36;
        --error: #ff8787;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      font-size: 20px;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 32px;
      line-height: 1.25;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: 600;
    }

    .hint {
      margin: 8px 0 0;
      font-size: 16px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 16px;
      font: inherit;
      font-size: 22px;
      color: var(--text);
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 14px;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      min-height: 64px;
      margin-top: 24px;
      padding: 16px;
      font: inherit;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-text);
      background: var(--accent);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      min-height: 140px;
      margin-top: 24px;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.45;
      word-break: keep-all;
      overflow-wrap: anywhere;
      border: 2px dashed var(--border);
      border-radius: 14px;
    }

    #result.empty,
    #result.loading {
      font-size: 20px;
      font-weight: 400;
      color: var(--muted);
    }

    #result.error {
      font-size: 20px;
      font-weight: 600;
      color: var(--error);
      border-color: var(--error);
    }
  </style>
</head>
<body>
  <main>
    <h1>오늘의 응원 한마디</h1>

    <form id="cheer-form">
      <label for="name">공개용 닉네임</label>
      <input id="name" name="name" type="text" maxlength="20" autocomplete="off" placeholder="예: 햇살">
      <p class="hint">비워 두면 "여러분"으로 불러 드려요.</p>

      <button id="submit" type="submit">응원 받기</button>
    </form>

    <div id="result" class="empty" role="status" aria-live="polite">
      버튼을 누르면 응원 한마디가 여기에 나타나요.
    </div>
  </main>

  <script>
    const form = document.getElementById("cheer-form");
    const nameInput = document.getElementById("name");
    const button = document.getElementById("submit");
    const result = document.getElementById("result");

    function show(state, text) {
      result.className = state;
      result.textContent = text;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      show("loading", "응원 문장을 불러오는 중이에요…");

      try {
        // 상대 경로라서 Pages의 하위 경로와 Vercel 루트 양쪽에서 같은 코드로 동작한다.
        const response = await fetch("api/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nameInput.value.trim() }),
        });
        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        if (typeof data.text !== "string" || !data.text) throw new Error("빈 응답");

        show("", data.text);
      } catch (error) {
        show("error", "응원 문장을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
